plugins {
  id "idea"
  id "jacoco" // Java Code Coverage plugin
  id "io.github.ben-manes.versions" version "0.66.0"
  id "com.github.spotbugs" version "6.5.10" apply false
  id "checkstyle"
  id "org.openapi.generator" version "5.3.0"
  id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
}

group = 'io.cruise-control'

if (gradle.startParameter.projectProperties.containsKey('version')) {
  allprojects {
    version = gradle.startParameter.projectProperties['version']
  }
}

project.ext {
  pomConfig = {
    url "https://github.com/cruise-control-for-kafka/cruise-control"
    licenses {
      license {
        name "Apache License, Version 2.0"
        url "https://www.apache.org/licenses/LICENSE-2.0"
      }
    }
    developers {
      developer {
        name "Cruise Control for Kafka Maintainers"
        email "dev@lists.cruise-control.io"
        organization "Cruise Control for Kafka"
        organizationUrl "https://github.com/cruise-control-for-kafka"
      }
    }
    scm {
      url "https://github.com/cruise-control-for-kafka/cruise-control"
    }
  }
  buildVersionFileName = "cruise-control-version.properties"
  commitId = project.hasProperty('commitId') ? commitId : null
  scalaBinaryVersion = getScalaBinaryVersion(scalaVersion)

  defaultTestJvmArgs = []
  // "JEP 403: Strongly Encapsulate JDK Internals" causes some tests to fail when they try
  // to access internals (often via mocking libraries). We use `--add-opens` as a workaround
  if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_16))
    defaultTestJvmArgs.addAll(
        "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens=java.base/java.lang=ALL-UNNAMED",
        "--add-opens=java.base/java.time=ALL-UNNAMED",
        "--add-opens=java.base/java.util.concurrent=ALL-UNNAMED",
        "--add-opens=java.base/java.util=ALL-UNNAMED"
    )
}

allprojects {

  repositories {
    mavenCentral()
  }

  apply plugin: 'io.github.ben-manes.versions'

  dependencyUpdates {
    revision="release"
    resolutionStrategy {
      componentSelection { rules ->
        rules.all { ComponentSelection selection ->
          boolean rejected = ['snap', 'alpha', 'beta', 'rc', 'cr', 'm'].any { qualifier ->
            selection.candidate.version ==~ /(?i).*[.-]${qualifier}[.\d-]*/
          }
          if (rejected) {
            selection.reject('Release candidate')
          }
        }
      }
    }
  }
}

subprojects {
  group = rootProject.group
  version = rootProject.version

  apply plugin: 'java'
  apply plugin: 'java-library'
  apply plugin: 'checkstyle'
  apply plugin: 'maven-publish'
  apply plugin: 'signing'
  apply plugin: "com.github.spotbugs"
  apply plugin: 'jacoco'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
  }

  dependencies {
    // Jackson is mostly a transitive dependency; this BOM aligns versions across Kafka, Swagger, and Vertx dependencies
    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonBomVersion}")
  }

  tasks.register("sourcesJar", Jar) {
    dependsOn(classes)
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
  }

  tasks.register("javadocJar", Jar) {
    dependsOn(javadoc)
    archiveClassifier.set("javadoc")
    from javadoc.destinationDir
  }

  //code quality and inspections
  checkstyle {
    toolVersion = checkstyleVersion
    ignoreFailures = false
    configDirectory = file("$rootDir/checkstyle")
  }

  spotbugs {
    toolVersion = spotbugsVersion
    excludeFilter = file("$rootDir/gradle/findbugs-exclude.xml")
    ignoreFailures = false
    jvmArgs = [ '-Xms512m' ]
    maxHeapSize = '768m'
    showProgress = true
  }
  spotbugsMain {
    reports {
      xml.required = project.hasProperty('xmlFindBugsReport')
      html.required = !project.hasProperty('xmlFindBugsReport')
    }
  }
  spotbugsTest {
    reports {
      xml.required = project.hasProperty('xmlFindBugsReport')
      html.required = !project.hasProperty('xmlFindBugsReport')
    }
  }
  // aggregated task for checkstyle and spotbugs static analyzers
  tasks.register('analyze') {
    dependsOn('checkstyleMain', 'checkstyleTest', 'spotbugsMain', 'spotbugsTest')
    doLast {}
  }

  test.dependsOn('checkstyleMain', 'checkstyleTest', 'spotbugsMain', 'spotbugsTest')

  jar {
    from "$rootDir/LICENSE"
    from "$rootDir/NOTICE"
  }

  test {
    jvmArgs += defaultTestJvmArgs

    useJUnit {}
    testLogging {
      events "passed", "failed", "skipped"
      exceptionFormat = 'full'
    }
    if (!project.hasProperty("maxParallelForks")) {
      maxParallelForks = Runtime.runtime.availableProcessors()
    }
    // Recycle the JVM periodically with sufficient heap. Running all embedded Kafka/KDC tests
    // in a single JVM accumulates resources, causing OOMs and GC timeouts.
    forkEvery = 25
    maxHeapSize = '2g'
    finalizedBy jacocoTestReport
  }

  jacocoTestReport {
    reports {
      xml.required = false
      csv.required = false
      html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
  }

  signing {
    required = { gradle.taskGraph.hasTask("publishToSonatype") }
    def signingKeyId = findProperty("signingKeyId")
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    sign publishing.publications
  }
}

nexusPublishing {
  repositories {
    sonatype {
      nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
      snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
      username = System.getenv('MAVEN_USERNAME') ?: findProperty('sonatypeUsername')
      password = System.getenv('MAVEN_PASSWORD') ?: findProperty('sonatypePassword')
    }
  }
}

project(':cruise-control-core') {

  configurations {
    testOutput
  }

  dependencies {
    configurations.all {
      exclude group: 'org.slf4j', module: 'slf4j-log4j12'
      exclude group: 'log4j', module: 'log4j'
      exclude group: 'ch.qos.logback'
    }
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.commons:commons-math3:${commonsMathVersion}"

    api "io.vertx:vertx-core:${vertxVersion}"
    api "io.vertx:vertx-web:${vertxVersion}"

    testImplementation "junit:junit:${junitVersion}"

    testOutput sourceSets.test.output
  }

  publishing {
    publications {
      java(MavenPublication) {
        from components.java
        artifact sourcesJar
        artifact javadocJar
        pom.withXml {
          def root = asNode()
          root.appendNode('name', 'cruise-control-core')
          root.appendNode('description', 'cruise control core related')
          root.children().last() + rootProject.ext.pomConfig
        }
      }
    }
  }

  sourceSets {
    main {
      java {
        srcDirs = ['src/main/java']
      }
    }
    test {
      java {
        srcDirs = ['src/test/java']
      }
    }

  }

}

project(':cruise-control') {
  apply plugin: 'scala'

  //needed because our java classes depend on scala classes, so must be compiled by scala
  sourceSets {
    main {
      java {
        srcDirs = []
      }

      scala {
        srcDirs = ['src/main/java', 'src/main/scala']
      }
    }

    test {
      java {
        srcDirs = []
      }
      scala {
        srcDirs = ['src/test/java', 'src/test/scala']
      }
    }

    integrationTest {
      java {
        srcDirs = ["src/integrationTest/java"]
      }
      resources {
        srcDirs = ['src/integrationTest/resources']
      }
      compileClasspath += main.output + test.output
      runtimeClasspath += main.output + test.output
    }

  }

  configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntime.extendsFrom testRuntime
   }

  dependencies {
    configurations.all {
      exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
      exclude group: 'org.slf4j', module: 'slf4j-log4j12'
      exclude group: 'log4j', module: 'log4j'
      exclude group: 'ch.qos.logback'
    }

    api project(':cruise-control-metrics-reporter')
    api project(':cruise-control-core')
    api "com.google.guava:guava:${guavaVersion}"
    api "io.swagger.core.v3:swagger-annotations:${swaggerVersion}"
    api "io.swagger.core.v3:swagger-core:${swaggerVersion}"
    api "io.vertx:vertx-web-openapi:${vertxVersion}"
    api "io.vertx:vertx-core:${vertxVersion}"
    api "io.vertx:vertx-web:${vertxVersion}"
    api "io.vertx:vertx-junit5:${vertxVersion}"
    api "org.apache.kafka:kafka_$scalaBinaryVersion:$kafkaVersion"
    api "org.apache.kafka:kafka-server:$kafkaVersion"
    api "org.apache.kafka:kafka-server-common:$kafkaVersion"
    api "org.apache.kafka:kafka-clients:$kafkaVersion"
    api "org.apache.kafka:kafka-storage:$kafkaVersion"
    api "org.eclipse.jetty.ee10:jetty-ee10-servlet:${jettyVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    implementation "org.apache.commons:commons-math3:${commonsMathVersion}"
    implementation "org.apache.httpcomponents:httpclient:${httpclientVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "org.eclipse.jetty:jetty-server:${jettyVersion}"
    implementation "io.dropwizard.metrics:metrics-jmx:${metricsJmxVersion}"
    implementation "com.nimbusds:nimbus-jose-jwt:${nimbusJoseJwtVersion}"
    implementation "io.swagger.parser.v3:swagger-parser-v3:${swaggerParserVersion}"
    implementation "io.github.classgraph:classgraph:${classgraphVersion}"
    implementation "com.google.code.findbugs:jsr305:${jsr305Version}"

    constraints {
      implementation("org.apache.logging.log4j:log4j-core:${log4jVersion}") {
        because("CVE-2026-34481 fixed in 2.25.4, additional CVEs fixed in 2.25.5")
      }
      implementation("org.apache.logging.log4j:log4j-layout-template-json:${log4jVersion}") {
        because("CVE-2026-34481 fixed in 2.25.4, additional CVEs fixed in 2.25.5")
      }
    }

    testImplementation project(path: ':cruise-control-metrics-reporter', configuration: 'testOutput')
    testImplementation project(path: ':cruise-control-core', configuration: 'testOutput')
    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.easymock:easymock:${easymockVersion}"
    testImplementation "org.apache.kafka:kafka_$scalaBinaryVersion:$kafkaVersion:test"
    testImplementation "org.apache.kafka:kafka-clients:$kafkaVersion:test"
    testImplementation "org.apache.httpcomponents:httpclient:${httpclientVersion}:tests"
    testImplementation "org.bouncycastle:bcpkix-jdk15on:${bouncyCastleVersion}"
    testImplementation "org.apache.kerby:kerb-simplekdc:${kerbSimpleKdcVersion}"
    testImplementation "com.jayway.jsonpath:json-path:${jsonPathVersion}"
    testImplementation "org.powermock:powermock-module-junit4:${powermockVersion}"
    testImplementation "org.powermock:powermock-api-easymock:${powermockVersion}"
    testImplementation "org.testcontainers:kafka:$testcontainersVersion"
  }

  publishing {
    publications {
      java(MavenPublication) {
        from components.java
        artifact sourcesJar
        artifact javadocJar
        pom.withXml {
          def root = asNode()
          root.appendNode('name', 'cruise-control')
          root.appendNode('description', 'cruise control related')
          root.children().last() + rootProject.ext.pomConfig
        }
      }
    }
  }

  tasks.register("copyDependantLibs", Copy) {
    from (configurations.testRuntimeClasspath) {
      include('log4j-slf4j2-impl*')
    }
    from (configurations.runtimeClasspath) {

    }
    into layout.buildDirectory.dir("dependant-libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

  tasks.register("buildFatJar", Jar) {
    dependsOn("createVersionFile", ":cruise-control-metrics-reporter:jar", ":cruise-control-core:jar")
    archiveBaseName = project.name + '-all'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    manifest {
      attributes("Multi-Release": true)
    }
    with jar
  }

  compileScala.finalizedBy(tasks.copyDependantLibs)

  tasks.register("determineCommitId") {
    def takeFromHash = 40
    if (commitId) {
      commitId = commitId.take(takeFromHash)
    } else if (file("$rootDir/.git/HEAD").exists()) {
      def headRef = file("$rootDir/.git/HEAD").text
      if (headRef.contains('ref: ')) {
        headRef = headRef.replaceAll('ref: ', '').trim()
        if (file("$rootDir/.git/$headRef").exists()) {
          commitId = file("$rootDir/.git/$headRef").text.trim().take(takeFromHash)
        }
      } else {
        commitId = headRef.trim().take(takeFromHash)
      }
    } else {
      commitId = "unknown"
    }
  }

  // Referenced similar method for getting software version in Kafka code.
  tasks.register("createVersionFile") {
    dependsOn("determineCommitId")
    ext.receiptFile = layout.buildDirectory.file("cruise-control/$buildVersionFileName").get().asFile
    outputs.file receiptFile
    outputs.upToDateWhen { false }
    doLast {
      def data = [
          commitId: commitId,
          version: version,
      ]

      receiptFile.parentFile.mkdirs()
      def content = data.entrySet().collect { "$it.key=$it.value" }.sort().join("\n")
      receiptFile.setText(content, "ISO-8859-1")
    }
  }

  tasks.register("integrationTest", Test) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    testLogging {
      events "passed", "failed", "skipped"
      exceptionFormat = 'full'
    }
  }

  compileIntegrationTestJava.dependsOn copyDependantLibs

  jar {
    dependsOn createVersionFile
    from(layout.buildDirectory) {
      include "cruise-control/$buildVersionFileName"
    }
  }

  tasks.register("generateOpenApiJson", org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    inputSpec = "$rootDir/cruise-control/src/main/resources/yaml/base.yaml"
    generatorName = "openapi"
    outputDir = "$rootDir/cruise-control/src/main/resources/webroot"
  }

  processResources.dependsOn generateOpenApiJson
  compileJava.dependsOn generateOpenApiJson
}

project(':cruise-control-metrics-reporter') {

  configurations {
    testOutput
  }

  dependencies {
    configurations.all {
      exclude group: 'org.slf4j', module: 'slf4j-log4j12'
      exclude group: 'log4j', module: 'log4j'
      exclude group: 'ch.qos.logback'
    }

    compileOnly "org.slf4j:slf4j-api:${slf4jLegacyVersion}"
    implementation "com.yammer.metrics:metrics-core:${yammerMetricsVersion}"
    implementation "org.apache.kafka:kafka_$scalaBinaryVersion:$kafkaVersion"
    implementation "org.apache.kafka:kafka-server:$kafkaVersion"
    implementation "org.apache.kafka:kafka-clients:$kafkaVersion"
    implementation "com.google.code.findbugs:jsr305:${jsr305Version}"

    testImplementation "junit:junit:${junitVersion}"
    testImplementation "org.bouncycastle:bcpkix-jdk15on:${bouncyCastleVersion}"
    testImplementation "org.powermock:powermock-module-junit4:${powermockVersion}"
    testImplementation "org.powermock:powermock-api-easymock:${powermockVersion}"
    testImplementation "org.apache.kafka:kafka-clients:$kafkaVersion:test"
    testImplementation "org.apache.kafka:kafka-server-common:$kafkaVersion"
    testImplementation "org.apache.kafka:kafka-group-coordinator:$kafkaVersion"
    testImplementation "org.apache.kafka:kafka-metadata:$kafkaVersion"
    testImplementation "org.apache.kafka:kafka-raft:$kafkaVersion"
    testImplementation "org.apache.kafka:kafka-storage:$kafkaVersion"
    testImplementation "org.testcontainers:kafka:$testcontainersVersion"
    testRuntimeOnly "org.slf4j:slf4j-api:${slf4jLegacyVersion}"
    testRuntimeOnly "org.apache.logging.log4j:log4j-slf4j-impl:${log4jVersion}"
    testRuntimeOnly "org.apache.logging.log4j:log4j-core:${log4jVersion}"
    testOutput sourceSets.test.output
  }

  publishing {
    publications {
      java(MavenPublication) {
        from components.java
        artifact sourcesJar
        artifact javadocJar
        pom.withXml {
          def root = asNode()
          root.appendNode('name', 'cruise-control-metrics-reporter')
          root.appendNode('description', 'cruise control metrics reporter related')
          root.children().last() + rootProject.ext.pomConfig
        }
      }
    }
  }

}

tasks.register("buildApiWiki", Exec) {
  workingDir '.'
  commandLine './build_api_wiki.sh'
}

static def getScalaBinaryVersion(versionStr) {
  String[] versionList = versionStr.split("\\.")
  return versionList[0] + "." + versionList[1]
}

//wrapper generation task
wrapper {
  gradleVersion = '8.14'
  distributionType = Wrapper.DistributionType.ALL
}
