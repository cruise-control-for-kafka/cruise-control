services:
  kafka:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    container_name: Kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_METRIC_REPORTERS: "com.linkedin.kafka.cruisecontrol.metricsreporter.CruiseControlMetricsReporter"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list >/dev/null 2>&1
        do
          echo "Waiting for Kafka..."
          sleep 5
        done

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic __CruiseControlMetrics \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=delete

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic __KafkaCruiseControlPartitionMetricSamples \
          --partitions 1 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic __KafkaCruiseControlModelTrainingSamples \
          --partitions 1 \
          --replication-factor 1

  cruise-control:
    build:
      context: .
      dockerfile: Dockerfile.cruise-control
    container_name: cruise-control
    ports:
      - "9090:9090"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -c
      - |
        sed -i 's/^bootstrap.servers=.*/bootstrap.servers=kafka:29092/' config/cruisecontrol.properties
        sed -i 's/^sample.store.topic.replication.factor=.*/sample.store.topic.replication.factor=1/' config/cruisecontrol.properties
        ./kafka-cruise-control-start.sh config/cruisecontrol.properties 9090

volumes:
  kafka-data: