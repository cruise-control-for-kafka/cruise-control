name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to publish (e.g., 3.1.0 or 3.1.0-rc1)'
        required: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate release tag format
        run: |
          if ! echo "$RELEASE_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "Error: release_tag must be a valid version (e.g., 3.1.0 or 3.1.0-rc1)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out tag
        run: |
          ACTUAL="$(git describe --exact-match --tags HEAD)"
          if [ "$ACTUAL" != "$RELEASE_TAG" ]; then
            echo "Checked out $ACTUAL, expected $RELEASE_TAG"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central staging
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew publishToSonatype closeSonatypeStagingRepository -Pversion="$RELEASE_TAG"
