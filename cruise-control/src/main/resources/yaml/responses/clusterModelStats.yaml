ClusterModelStats:
  type: object
  required:
    - metadata
    - statistics
  properties:
    metadata:
      $ref: '#/ClusterModelStatsMetaData'
    statistics:
      $ref: '#/ClusterModelStatsValue'
    diskStatistics:
      $ref: '#/DiskBalanceStats'

ClusterModelStatsMetaData:
  type: object
  required:
    - brokers
    - replicas
    - topics
  properties:
    brokers:
      type: integer
      format: int32
    replicas:
      type: integer
      format: int32
    topics:
      type: integer
      format: int32

ClusterModelStatsValue:
  type: object
  required:
    - AVG
    - MAX
    - MIN
    - STD
  properties:
    AVG:
      $ref: '#/ClusterModelStatsValueHolder'
    MAX:
      $ref: '#/ClusterModelStatsValueHolder'
    MIN:
      $ref: '#/ClusterModelStatsValueHolder'
    STD:
      $ref: '#/ClusterModelStatsValueHolder'

ClusterModelStatsValueHolder:
  type: object
  required:
    - cpu
    - networkInbound
    - networkOutbound
    - disk
    - potentialNwOut
    - replicas
    - leaderReplicas
    - topicReplicas
  properties:
    cpu:
      type: number
      format: double
    networkInbound:
      type: number
      format: double
    networkOutbound:
      type: number
      format: double
    disk:
      type: number
      format: double
    potentialNwOut:
      type: number
      format: double
    replicas:
      type: number
    leaderReplicas:
      type: number
    topicReplicas:
      type: number

DiskBalanceStats:
  type: object
  description: Balance between the disks of each broker, only present if the cluster model has disk information. Disks with no
    capacity, such as disks being removed, are left out.
  required:
    - numAliveDisks
    - numUnbalancedDisks
    - numDisksAboveCapacityLimit
    - maxDiskUtilizationPct
    - maxDiskUtilizationBroker
    - maxDiskUtilizationLogdir
    - maxDiskUtilizationSpreadPct
    - diskUtilizationStDevPct
  properties:
    numAliveDisks:
      type: integer
      format: int32
    numUnbalancedDisks:
      description: Number of disks whose utilization is out of the balance range of their broker that IntraBrokerDiskUsageDistributionGoal
        enforces, i.e. the utilization of the broker times 1 +/- (disk.balance.threshold - 1) * 0.9.
      type: integer
      format: int32
    numDisksAboveCapacityLimit:
      description: Number of disks whose utilization is above disk.capacity.threshold.
      type: integer
      format: int32
    maxDiskUtilizationPct:
      description: Highest disk utilization percentage.
      type: number
      format: double
    maxDiskUtilizationBroker:
      description: Broker of the disk with the highest utilization percentage.
      type: integer
      format: int32
    maxDiskUtilizationLogdir:
      description: Logdir of the disk with the highest utilization percentage.
      type: string
    maxDiskUtilizationSpreadPct:
      description: Largest difference between the highest and the lowest disk utilization percentage of a broker, in percentage points.
      type: number
      format: double
    maxDiskUtilizationSpreadBroker:
      description: Broker with the largest disk utilization spread, only present if a broker has at least two disks.
      type: integer
      format: int32
    diskUtilizationStDevPct:
      description: Standard deviation of the utilization percentage of disks from the one of their broker, in percentage points.
      type: number
      format: double
