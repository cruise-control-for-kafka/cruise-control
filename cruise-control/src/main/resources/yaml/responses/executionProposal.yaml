ExecutionProposal:
  type: object
  required:
    - topicPartition
    - oldLeader
    - oldReplicas
    - newReplicas
  properties:
    topicPartition:
      type: string
    oldLeader:
      type: integer
      format: int32
    oldReplicas:
      type: array
      items:
        type: integer
        format: int32
    newReplicas:
      type: array
      items:
        type: integer
        format: int32
    oldReplicaLogdirs:
      description: Logdirs of the old replicas, in the same order as oldReplicas. Only present for intra-broker (disk) movements.
      type: array
      items:
        type: string
    newReplicaLogdirs:
      description: Logdirs of the new replicas, in the same order as newReplicas. Only present for intra-broker (disk) movements.
      type: array
      items:
        type: string
