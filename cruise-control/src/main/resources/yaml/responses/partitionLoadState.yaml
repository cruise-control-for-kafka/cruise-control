PartitionLoadState:
  type: object
  required:
    - version
    - records
  properties:
    version:
      type: integer
      format: int32
    records:
      type: array
      items:
        $ref: '#/PartitionLoadRecord'

PartitionLoadRecord:
  type: object
  required:
    - topic
    - partition
    - leader
    - followers
    - cpu
    - networkInbound
    - networkOutbound
    - disk
    - msg_in
  properties:
    topic:
      type: string
    partition:
      type: integer
      format: int32
    leader:
      type: integer
      format: int32
    followers:
      type: array
      items:
        type: integer
        format: int32
    cpu:
      type: integer
      format: double
    networkInbound:
      type: integer
      format: double
    networkOutbound:
      type: integer
      format: double
    disk:
      type: integer
      format: double
    msg_in:
      type: integer
      format: double
    leaderLogdir:
      description: Logdir of the leader replica. Only present with populate_disk_info=true, and if the logdir of the leader is known.
      type: string
    followerLogdirs:
      description: Logdirs of the follower replicas, in the same order as followers. Null for a replica whose logdir is not known,
                   i.e. a replica on a dead broker or a failed disk. Only present with populate_disk_info=true.
      type: array
      items:
        type: string
        nullable: true
